name: CI and release image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create isolated quality environment
        run: |
          python -m venv .venv-ci
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Update pip
        run: python -m pip install --upgrade "pip==26.3"
      - name: Install app and development tools
        run: python -m pip install ".[dev]"
      - name: Lint and format check
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Test
        run: pytest
      - name: Audit application dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit .
          pip-audit --local --skip-editable

  image-check:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ecommerce-product-order-api:ci
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecommerce-product-order-api:ci
          scan-type: image
          version: v0.76.2
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
