[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-product-order-api"
version = "1.0.0"
description = "A compact, deployment-ready product and order API assignment MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.0",
  "email-validator==2.2.0",
  "fastapi==0.115.6",
  "psycopg[binary]==3.2.3",
  "SQLAlchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

