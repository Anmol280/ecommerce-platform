[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-product-order-api"
version = "1.0.0"
description = "A compact, deployment-ready product and order API assignment MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.0",
  "email-validator==2.2.0",
  "fastapi==0.162.5",
  "starlette==1.10.0",
  "psycopg[binary]==3.2.3",
  "SQLAlchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.16.0",
  "pytest==9.0.3",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

